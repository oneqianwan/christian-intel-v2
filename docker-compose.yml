services:
  postgres:
    image: postgres:16-alpine
    container_name: intel_postgres
    environment:
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: intel123
      POSTGRES_DB: christian_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intel_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

volumes:
  pgdata:
  redisdata:
